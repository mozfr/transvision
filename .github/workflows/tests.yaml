name: Run Tests
on:
  # Trigger on push to the default branch
  push:
    branches:
      - main
  # Trigger the workflow on pull request events
  # but only for the default branch
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions:
          - '8.4'
          - '8.5'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-versions }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist

      - name: Install Node packages
        run: sudo npm install -g eslint@8.57.0

      - name: Run JS linter (eslint)
        run: eslint web/js

      - name: Run PHP linter (php-cs-fixer)
        run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer --diff --dry-run -v fix

      - name: Create config file
        run: cp app/config/config.ini-ghactions app/config/config.ini

      - name: Unit tests
        run: php ./vendor/bin/phpunit

      - name: Functional tests (API, pages)
        run: |
          php tests/functional/api.php
          php tests/functional/pages.php
